spring:
  application:
    name: jameati-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jameati?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:jameati}
    password: ${DB_PASSWORD:jameati}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${SPRING_MAIL_TIMEOUT:10000}
      mail.smtp.writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:10000}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  official-catalog:
    enabled: ${OFFICIAL_CATALOG_ENABLED:true}
    resource: ${OFFICIAL_CATALOG_RESOURCE:data/official-catalog.json}
    expanded-resource: ${OFFICIAL_EXPANDED_CATALOG_RESOURCE:data/official-expanded-catalog.json}
    supplemental-resource: ${OFFICIAL_SUPPLEMENTAL_CATALOG_RESOURCE:data/official-hourly-work-links.json}
    jordan-universities-resource: ${OFFICIAL_JORDAN_UNIVERSITIES_RESOURCE:data/official-jordan-universities.json}
  test-accounts:
    # حسابات V11 التجريبية (باسوورد معروف). مقفلة افتراضيًا على السيرفر.
    enabled: ${TEST_ACCOUNTS_ENABLED:false}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:مدير المنصة}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-that-is-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION:900000}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION:2592000000}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    refresh-cookie-max-age: ${AUTH_REFRESH_COOKIE_MAX_AGE:2592000}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-size-bytes: ${MEDIA_MAX_SIZE_BYTES:10485760}
  analytics:
    hash-secret: ${ANALYTICS_HASH_SECRET:local-analytics-hash-secret-change-in-production}
  mail:
    from: ${MAIL_FROM:no-reply@jameati.local}
    frontend-url: ${MAIL_FRONTEND_URL:http://localhost:3000}
    verification-token-minutes: ${MAIL_VERIFICATION_TOKEN_MINUTES:1440}
    reset-token-minutes: ${MAIL_RESET_TOKEN_MINUTES:30}
    campaign-poll-ms: ${MAIL_CAMPAIGN_POLL_MS:60000}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}
    contact-requests-per-minute: ${CONTACT_RATE_LIMIT_PER_MINUTE:5}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:900}
    messages-per-hour: ${AI_MESSAGES_PER_HOUR:20}
    global-messages-per-hour: ${AI_GLOBAL_MESSAGES_PER_HOUR:1000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  opportunity:
    closing-soon-days: ${CLOSING_SOON_DAYS:14}
  integration:
    # مفتاح سري لاستقبال الفرص من أدوات خارجية (مثل Tab على واتساب). فاضي = الخاصية مقفلة.
    api-key: ${INTEGRATION_API_KEY:}
  recommendation:
    candidate-limit: ${RECOMMENDATION_CANDIDATE_LIMIT:200}
    minimum-score: ${RECOMMENDATION_MINIMUM_SCORE:55}
  crm:
    timezone: ${CRM_TIMEZONE:Asia/Amman}
    initial-follow-up-hours: ${CRM_INITIAL_FOLLOW_UP_HOURS:24}
  membership:
    mock-payment-enabled: ${MEMBERSHIP_MOCK_PAYMENT_ENABLED:false}
    receipt-auto-activation-enabled: ${MEMBERSHIP_RECEIPT_AUTO_ACTIVATION_ENABLED:true}
    receipt-storage-path: ${MEMBERSHIP_RECEIPT_STORAGE_PATH:./data/membership-receipts}
    receipt-max-size-bytes: ${MEMBERSHIP_RECEIPT_MAX_SIZE_BYTES:5242880}
  payment:
    mpgs:
      enabled: ${MPGS_ENABLED:true}
      base-url: ${MPGS_BASE_URL:https://test-network.mtf.gateway.mastercard.com/api/}
      merchant-id: ${MPGS_MERCHANT_ID:test12122024}
      api-username: ${MPGS_API_USERNAME:merchant.test12122024}
      api-password: ${MPGS_API_PASSWORD:0cb74bdcb05329641aa7bed1caff4e8a}
      api-version: ${MPGS_API_VERSION:100}
      frontend-return-url: ${MPGS_FRONTEND_RETURN_URL:http://localhost:3000}
      connect-timeout-seconds: ${MPGS_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${MPGS_READ_TIMEOUT_SECONDS:20}
  official-import:
    auto-run: ${OFFICIAL_IMPORT_AUTO_RUN:true}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-system}] %logger{36} - %msg%n"
