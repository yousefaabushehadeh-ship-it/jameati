spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "jdbc:h2:mem:jameati;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
app:
  test-accounts:
    enabled: true
  official-catalog:
    enabled: false
  bootstrap-admin:
    enabled: false
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
    expiration-ms: 900000
    refresh-expiration-ms: 2592000000
  cors-origins: http://localhost:3000
  opportunity:
    closing-soon-days: 14
  official-import:
    auto-run: false
  media:
    storage-path: ${java.io.tmpdir}/jameati-test-media
    max-size-bytes: 1048576
  membership:
    receipt-auto-activation-enabled: true
    receipt-storage-path: ${java.io.tmpdir}/jameati-test-membership-receipts
    receipt-max-size-bytes: 1048576
  rate-limit:
    auth-requests-per-minute: 1000
    contact-requests-per-minute: 1000
